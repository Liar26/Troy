<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TROY</title>
  <meta name="description" content="TROY: a calm gallery of public-domain paintings from museums around the world, shown in their original proportions.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/art.css">
  <script>
    // Apply the saved theme before first paint (dark is the default).
    try { var t = JSON.parse(localStorage.getItem('troy.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <!-- Background art: drawn by art.js (pick a style with the Art button) -->
  <div id="art-glow" class="art-glow" aria-hidden="true"></div>
  <canvas id="art" class="art" aria-hidden="true"></canvas>


  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="/" data-link aria-label="TROY home"><img class="logo" src="/logo.png" alt="" height="44"><b>TROY<span>.</span></b></a>
      <nav class="nav" aria-label="Main">
        <a href="/explore" data-link data-nav="/explore">Explore</a>
        <a href="/artists" data-link data-nav="/artists">Artists</a>
        <a href="/timeline" data-link data-nav="/timeline">Timeline</a>
        <a href="/today" data-link data-nav="/today">Today</a>
        <a href="/about" data-link data-nav="/about">About</a>
      </nav>
      <div class="hdr-search" id="hdr-search" hidden>
        <input class="field" id="hq" type="search" placeholder="Search paintings…" aria-label="Search paintings" autocomplete="off">
        <div class="sugg" id="hsugg" hidden></div>
      </div>
      <div class="controls">
        <button class="art-btn" id="art-toggle" type="button" aria-label="Change background art" title="Change background art"><span class="lbl">Art</span><span class="nm" id="art-name"></span></button>
        <a class="saves-link" href="/saves" data-link data-nav="/saves">My Saves <span id="saves-count">0</span></a>
        <button class="icon-btn" id="theme-toggle" aria-label="Switch theme" title="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <span>TROY.</span>
      <span>Images and information: The Met, the Art Institute of Chicago and the Cleveland Museum of Art, public domain (CC0). <a href="/about" data-link>About</a> · <a href="/privacy" data-link>Privacy &amp; safety</a> · <a href="/contact" data-link>Contact</a></span>
    </div>
  </footer>

  <div id="modal-root"></div>
  <script src="/art.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
